<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121216">
<title>Claude Music</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0e0e11; --panel:#16161b; --panel2:#1e1e25; --hover:#2a2a33; --line:#2c2c35;
  --text:#f2f2f5; --muted:#a0a0ad; --dim:#6c6c78;
  --accent:#ff6b4a; --accent2:#ffb347; --accent-ink:#1a0b06;
  --radius:10px; --bar:84px; --nav:0px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
.app{display:grid;grid-template-columns:240px 1fr 340px;grid-template-rows:1fr var(--bar);height:100dvh;gap:8px;padding:8px}
.app.no-np{grid-template-columns:240px 1fr}
.app.no-np .np{display:none}

/* zijbalk */
.side{background:var(--panel);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.brand .logo{width:30px;height:30px}
.nav a{display:flex;align-items:center;gap:14px;padding:10px 18px;color:var(--muted);font-weight:600;border-radius:8px;margin:0 6px}
.nav a:hover{color:var(--text)}
.nav a.active{color:var(--text);background:var(--panel2)}
.nav svg{width:22px;height:22px}
.side h4{margin:18px 18px 6px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.side h4 button{color:var(--muted);font-size:20px;line-height:1;width:26px;height:26px;border-radius:50%}
.side h4 button:hover{background:var(--hover);color:var(--text)}
.pl-list{overflow:auto;flex:1;padding:0 6px 10px}
.pl-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--muted)}
.pl-item:hover{background:var(--panel2);color:var(--text)}
.pl-item.active{background:var(--panel2);color:var(--text)}
.pl-item .cov{width:40px;height:40px;border-radius:6px;flex:none}
.pl-item .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-item .s{font-size:12px;color:var(--dim)}

/* hoofdgedeelte */
.main{background:var(--panel);border-radius:var(--radius);overflow:auto;min-height:0;position:relative}
.main-inner{padding:20px 24px 40px}
.hero{padding:40px 24px 24px;display:flex;gap:24px;align-items:flex-end;background:linear-gradient(180deg,var(--hero,#5a2a20) 0%, var(--panel) 100%)}
.hero .cov{width:200px;height:200px;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);flex:none}
.hero .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.hero h1{font-size:clamp(28px,5vw,64px);margin:6px 0 10px;letter-spacing:-1.5px;line-height:1.05;word-break:break-word}
.hero .meta{color:var(--muted);font-size:14px}
.actions{display:flex;align-items:center;gap:18px;padding:18px 24px}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,107,74,.35);transition:transform .1s}
.bigplay:hover{transform:scale(1.05)}
.bigplay svg{width:24px;height:24px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--text)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.on{color:var(--accent)}
h2{font-size:22px;margin:26px 0 12px;letter-spacing:-.3px}
h2:first-child{margin-top:4px}
.greet{font-size:30px;margin:0 0 18px;letter-spacing:-.6px}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.quick a{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;font-weight:700;font-size:14px;height:56px;padding-right:10px}
.quick a:hover{background:rgba(255,255,255,.12)}
.quick .cov{width:56px;height:56px;flex:none}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:transparent;padding:12px;border-radius:8px;position:relative;text-align:left;display:block}
.card:hover{background:var(--panel2)}
.card .img{aspect-ratio:1;border-radius:6px;overflow:hidden;margin-bottom:10px;position:relative;background:#222}
.card img{width:100%;height:100%;object-fit:cover}
.card .img>.cov{width:100%;height:100%}
.card .t{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .fab{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.15s;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.card:hover .fab{opacity:1;transform:none}
.card .fab svg{width:18px;height:18px}
.card .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.75);font-size:11px;font-weight:700;padding:3px 6px;border-radius:4px}
.card .resume{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.card .resume i{display:block;height:100%;background:var(--accent)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,180px);gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 0 4px}
.row::-webkit-scrollbar{display:none}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h a{color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
.sec-h a:hover{color:var(--text);text-decoration:underline}
.seg{display:flex;gap:8px;margin:4px 0 6px}
.seg button{padding:7px 14px;border-radius:999px;background:var(--panel2);font-size:14px;font-weight:600}
.seg button.on{background:var(--text);color:#000}
@media (max-width:720px){.row{grid-auto-columns:minmax(140px,150px);margin:0 -4px}}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.chip{height:100px;border-radius:8px;padding:14px;font-weight:800;font-size:20px;position:relative;overflow:hidden;text-align:left;letter-spacing:-.3px}
.chip:hover{filter:brightness(1.1)}
.chip span{position:absolute;right:-10px;bottom:-14px;font-size:64px;transform:rotate(18deg);opacity:.85}

.searchbox{position:sticky;top:0;z-index:5;background:var(--panel);padding:16px 24px 8px;margin:-20px -24px 10px}
.searchbox label{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:999px;padding:0 16px;height:48px;border:2px solid transparent}
.searchbox label:focus-within{border-color:var(--text)}
.searchbox input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.searchbox svg{width:20px;height:20px;color:var(--muted)}

/* tracklijst */
.tracks{display:flex;flex-direction:column}
.thead,.tr{display:grid;grid-template-columns:36px minmax(0,1fr) 36px 56px 36px;gap:12px;align-items:center;padding:0 12px}
.thead{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;height:36px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tr{height:60px;border-radius:6px;color:var(--muted);font-size:14px}
.tr:hover,.tr.sel{background:var(--hover)}
.tr .n{text-align:center;font-variant-numeric:tabular-nums}
.tr .n .pi{display:none}
.tr:hover .n .num{display:none}
.tr:hover .n .pi{display:grid;place-items:center;color:var(--text)}
.tr .n svg{width:16px;height:16px;margin:auto}
.tr .info{display:flex;align-items:center;gap:12px;min-width:0}
.tr .info img{width:44px;height:44px;border-radius:4px;object-fit:cover;flex:none;background:#222}
.tr .tt{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.tr .ta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tr.playing .tt,.tr.playing .num{color:var(--accent)}
.tr .d{text-align:right;font-variant-numeric:tabular-nums}
.tr .like,.tr .more{opacity:0;color:var(--muted)}
.tr:hover .like,.tr:hover .more,.tr .like.on{opacity:1}
.tr .like.on{color:var(--accent)}
.tr .addb svg{width:20px;height:20px}
.card .cadd{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;opacity:0;transition:.15s}
.card:hover .cadd,.card .cadd.on{opacity:1}
.card .cadd.on{color:var(--accent)}
.card .cadd svg{width:22px;height:22px}
#barAdd.on{color:var(--accent)}
.sheet-scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#202028;border-radius:14px;width:100%;max-width:440px;max-height:min(640px,86vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet .sh-top{display:flex;gap:12px;align-items:center;padding:16px 16px 10px}
.sheet .sh-top img{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.sheet .sh-top .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh-top .a{font-size:13px;color:var(--muted)}
.sheet .sh-search{margin:0 16px 8px;display:flex;align-items:center;gap:8px;background:#2f2f3a;border-radius:8px;padding:0 12px;height:44px}
.sheet .sh-search svg{width:18px;height:18px;color:var(--muted);flex:none}
.sheet .sh-search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.sheet .sh-list{overflow:auto;padding:0 8px 8px;flex:1}
.sh-row{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:8px;text-align:left}
.sh-row:hover{background:var(--hover)}
.sh-row .cov{width:44px;height:44px;border-radius:6px;flex:none}
.sh-row .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-row .nm small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.sh-row .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none;color:#111}
.sh-row .ck svg{width:14px;height:14px}
.sh-row.on .ck{background:var(--accent);border-color:var(--accent)}
.sh-new .cov{background:#3a3a46;display:grid;place-items:center;font-size:24px;color:var(--text)}
.sheet .sh-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;border-top:1px solid var(--line)}
@media (max-width:720px){.sheet-scrim{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;max-height:88vh;max-width:none}}
.pl-item.drop{outline:2px solid var(--accent);background:var(--panel2)}
.add-res .tr{grid-template-columns:minmax(0,1fr) auto}
.add-res .tr .addbtn{border:1px solid var(--dim);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--text)}
.add-res .tr .addbtn:hover{border-color:var(--text);transform:scale(1.04)}
.add-res .tr .addbtn.on{border-color:var(--accent);color:var(--accent)}
.tr .like svg,.tr .more svg{width:18px;height:18px;margin:auto}
.tr .like:hover,.tr .more:hover{color:var(--text)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

.empty{color:var(--muted);padding:30px 0;text-align:center}
.empty .big{font-size:22px;color:var(--text);font-weight:700;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--text);color:#000;font-weight:700;border-radius:999px;padding:10px 22px}
.btn:hover{transform:scale(1.03)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--dim)}
.spinner{width:28px;height:28px;border:3px solid var(--hover);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* nu speelt */
.np{background:var(--panel);border-radius:var(--radius);overflow:auto;min-height:0;padding:16px;display:flex;flex-direction:column;gap:14px}
.np .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.vidwrap{flex:none;position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.vidwrap iframe,#ytp{position:absolute;inset:0;width:100%;height:100%}
.np .big-t{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.np .big-a{color:var(--muted)}
.np .qh{font-weight:700;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.np .qh button{font-size:13px;color:var(--muted)}
.np .qh button:hover{color:var(--text)}
.qitem{display:flex;gap:10px;align-items:center;padding:6px;border-radius:6px;cursor:pointer}
.qitem:hover{background:var(--hover)}
.qitem img{width:40px;height:40px;object-fit:cover;border-radius:4px;flex:none}
.qitem .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .x{margin-left:auto;color:var(--dim);opacity:0;width:28px;height:28px;flex:none}
.qitem:hover .x{opacity:1}
.qitem .x:hover{color:var(--text)}
.qitem>div{min-width:0}
.tl{max-height:260px;overflow:auto;display:flex;flex-direction:column;margin-top:4px}
.tl-i{display:flex;gap:10px;text-align:left;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--muted)}
.tl-i:hover{background:var(--hover);color:var(--text)}
.tl-i.on{color:var(--accent);background:rgba(255,107,74,.1);font-weight:700}
.tl-t{font-variant-numeric:tabular-nums;color:var(--dim);flex:none;width:52px}
.tl-i.on .tl-t{color:var(--accent)}
.sync-box{background:var(--panel2);border-radius:10px;padding:18px;margin-top:30px}
.sync-box h3{margin:0 0 6px}
.sync-code{font:700 22px ui-monospace,monospace;letter-spacing:2px;background:#0003;padding:8px 12px;border-radius:6px;display:inline-block;margin:8px 0;user-select:all}

/* spelerbalk */
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 8px;gap:16px}
.bar .now{display:flex;align-items:center;gap:12px;min-width:0}
.bar .now img[src^=data]{visibility:hidden}
.bar .now img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#222;flex:none}
.bar .now .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .now .a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .now>div{min-width:0}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctrl .btns{display:flex;align-items:center;gap:18px}
.ctrl .btns .iconbtn{width:32px;height:32px}
.ctrl .btns .iconbtn svg{width:18px;height:18px}
.pp{width:36px;height:36px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center}
.pp:hover{transform:scale(1.06)}
.pp svg{width:16px;height:16px}
.prog{display:flex;align-items:center;gap:8px;width:100%;max-width:620px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog span{width:38px;text-align:center}
.range{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--text) var(--p,0%),#4a4a55 var(--p,0%));outline:none;cursor:pointer}
.range:hover{background:linear-gradient(to right,var(--accent) var(--p,0%),#4a4a55 var(--p,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
.range:hover::-webkit-slider-thumb{opacity:1}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.right .range{max-width:110px}
.dot-badge{position:relative}
.dot-badge.on::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.rep1{position:absolute;font-size:8px;font-weight:800;top:4px;right:4px}

/* menu, dialoog, toast */
.menu{position:fixed;z-index:50;background:#26262f;border-radius:6px;padding:4px;min-width:220px;box-shadow:0 16px 40px rgba(0,0,0,.6);max-height:70vh;overflow:auto}
.menu button{display:flex;width:100%;text-align:left;padding:10px 12px;border-radius:4px;font-size:14px;gap:10px;align-items:center}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .lbl{font-size:11px;color:var(--dim);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:1px}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.dialog{background:#24242c;border-radius:10px;padding:22px;width:100%;max-width:420px}
.dialog h3{margin:0 0 14px}
.dialog input{width:100%;background:#3a3a45;border:1px solid transparent;border-radius:6px;padding:12px;outline:0;margin-bottom:16px}
.dialog input:focus{border-color:var(--muted)}
.dialog .row{display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + var(--nav) + 24px);transform:translateX(-50%);background:#e9e9ee;color:#111;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw}

/* mobiel */
.mnav{display:none}
.mini-vid-toggle{display:none}
@media (max-width:1100px){
  .app,.app.no-np{grid-template-columns:220px 1fr}
  .np{position:fixed;inset:0;z-index:40;border-radius:0;transform:translateY(100%);transition:transform .25s;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .np.open{transform:none}
  .app.no-np .np{display:flex}
  .np-close{display:grid!important}
}
@media (max-width:720px){
  :root{--bar:64px;--nav:58px}
  .app,.app.no-np{grid-template-columns:1fr;grid-template-rows:1fr var(--bar) var(--nav);padding:0;gap:0;height:100dvh}
  .side{display:none}
  .main{border-radius:0}
  .main-inner{padding:16px 16px 30px}
  .searchbox{margin:-16px -16px 10px;padding:12px 16px 8px}
  .hero{padding:28px 16px 16px;flex-direction:column;align-items:flex-start;gap:14px}
  .hero .cov{width:160px;height:160px;align-self:center}
  .actions{padding:12px 16px}
  .bar{grid-template-columns:1fr auto;padding:0 10px;margin:0 6px;background:#3a2620;border-radius:8px;height:56px;align-self:center;position:relative}
  .bar .now img{width:40px;height:40px}
  .ctrl .prog,.right,.ctrl .btns .hide-m{display:none}
  .ctrl .btns{gap:6px}
  .ctrl .pp{background:none;color:var(--text)}
  .ctrl .pp svg{width:22px;height:22px}
  .bar .mprog{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}
  .bar .mprog i{display:block;height:100%;background:var(--text);width:0}
  .mnav{display:flex;justify-content:space-around;align-items:center;background:linear-gradient(transparent,#000 40%);padding-bottom:env(safe-area-inset-bottom)}
  .mnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 16px}
  .mnav a.active{color:var(--text)}
  .mnav svg{width:24px;height:24px}
  .thead{display:none}
  .tr{grid-template-columns:minmax(0,1fr) 36px 36px;padding:0 4px}
  .card .cadd{opacity:1}

<script>
/* ---------- iconen ---------- */
const I = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5v14l10-7zM17 5h2v14h-2z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14L9 12zM5 5h2v14H5z"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-9.5-9.3C1 7.9 3.4 4 7.2 4c2 0 3.6 1.1 4.8 2.7C13.2 5.1 14.8 4 16.8 4 20.6 4 23 7.9 21.5 11.7 19.5 16.4 12 21 12 21z"/></svg>',
  heartOn:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.3C1 7.9 3.4 4 7.2 4c2 0 3.6 1.1 4.8 2.7C13.2 5.1 14.8 4 16.8 4 20.6 4 23 7.9 21.5 11.7 19.5 16.4 12 21 12 21z"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="m17 9 5 5M22 9l-5 5"/></svg>',
  np:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="m10 9 4 2-4 2z" fill="currentColor"/><path d="M7 21h10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-left:auto"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9" stroke-linecap="round"/></svg>',
  added:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="currentColor"/><path d="m7.5 12.3 3 3 6-6.3" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
};
const eqHTML = '<span class="eq"><i></i><i></i><i></i></span>';

/* ---------- opslag ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('dt.'+k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem('dt.'+k, JSON.stringify(v)); }catch{} if (SYNC_KEYS.includes(k)) markDirty(k); },
  raw(k, v){ try{ localStorage.setItem('dt.'+k, JSON.stringify(v)); }catch{} },
};
const SYNC_KEYS = ['likes','playlists','customSets','artists','pos'];
let syncCode = store.get('syncCode', null), syncUpdated = store.get('syncUpdated', 0), syncDirty = false, syncTimer = null, lastPull = 0, syncState = '';

let likes = store.get('likes', []);
let playlists = store.get('playlists', []);
let recent = store.get('recent', []);
const saveAll = () => { store.set('likes', likes); store.set('playlists', playlists); store.set('recent', recent); };

/* ---------- hulpjes ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb = (id, q='hqdefault') => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
const fmt = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
const uid = () => Math.random().toString(36).slice(2, 10);

// "Artiest - Titel (Official Video)" -> nette titel + artiest
function clean(t){
  if (t._c) return t;
  let title = t.title || '', artist = (t.artist || '').replace(/\s+en nog \d+$/,'').replace(/\s+en\s+.+$/,'');
  if ((t.seconds || 0) >= 1200){
    // live set / mix: volledige titel houden, alleen opschonen
    title = title.replace(/\s*[\(\[](official|full|hq|hd|4k)[^\)\]]*[\)\]]/ig,'').split(/\s*\|\s*/).filter(Boolean).join(' · ');
    return { id:t.id, title, artist, duration:t.duration, seconds:t.seconds, set:1, _c:1 };
  }
  title = title.replace(/\s*[\(\[][^\)\]]*(official|video|audio|lyric|lyrics|visuali[sz]er|clip|hd|hq|4k|remaster(ed)?|music video|videoclip|m\/v|mv)[^\)\]]*[\)\]]/ig, '')
               .replace(/\s*\|\s*.*$/, '').replace(/\s+(official\s+)?(music\s+)?(video|audio)$/i,'').trim();
  const m = title.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  if (m) { artist = m[1].trim(); title = m[2].trim(); }
  else artist = artist.replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').replace(/\s*Official$/i,'').trim();
  title = title.replace(/^["“](.+)["”]$/, '$1');
  return { id:t.id, title: title || t.title, artist, duration:t.duration, seconds:t.seconds, _c:1 };
}
const isLiked = t => t && likes.some(x => x.id === t.id);
function plCover(pl){
  const ids = [...new Set(pl.tracks.map(t => t.id))].slice(0,4);
  if (!ids.length) return `<div class="cov" style="background:linear-gradient(135deg,#3b3b48,#1f1f27);display:grid;place-items:center;color:#777"><svg viewBox="0 0 24 24" width="40%" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>`;
  if (ids.length < 4) return `<img class="cov" style="object-fit:cover" src="${thumb(ids[0])}" alt="">`;
  return `<div class="cov" style="display:grid;grid-template-columns:1fr 1fr;overflow:hidden">${ids.map(i=>`<img src="${thumb(i,'default')}" style="width:100%;height:100%;object-fit:cover" alt="">`).join('')}</div>`;
}
const likedCover = `<div class="cov" style="background:linear-gradient(135deg,#ff6b4a,#7a2bd6);display:grid;place-items:center;color:#fff"><svg viewBox="0 0 24 24" width="42%" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.3C1 7.9 3.4 4 7.2 4c2 0 3.6 1.1 4.8 2.7C13.2 5.1 14.8 4 16.8 4 20.6 4 23 7.9 21.5 11.7 19.5 16.4 12 21 12 21z"/></svg></div>`;

function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  if (document.querySelector('.sheet-scrim')){ el.style.bottom = 'auto'; el.style.top = 'calc(16px + env(safe-area-inset-top))'; }
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2600);
}

/* ---------- zoeken ---------- */
const searchCache = new Map();
async function search(q, mode = 'songs'){
  q = q.trim(); if (!q) return [];
  const id = ytId(q);
  const ck = mode + ':' + q;
  if (searchCache.has(ck)) return searchCache.get(ck);
  let sq = id || q;
  if (mode !== 'songs' && !id && !/\b(set|mix|live|liveset)\b/i.test(q)) sq += ' live set';
  const r = await fetch('api/search?q=' + encodeURIComponent(sq) + (mode === 'new' ? '&recent=1' : ''));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Zoeken mislukt');
  // lange mixen/concerten (> 20 min) weglaten, tenzij er dan te weinig over is
  let res = mode !== 'songs' ? j.results.filter(t => t.seconds >= 1200) : j.results.filter(t => !t.seconds || t.seconds <= 1200);
  if (mode !== 'new' && (res.length < (mode === 'sets' ? 3 : 5) || id)) res = j.results;
  res = res.map(clean);
  if (id) res.sort((a,b) => (b.id===id) - (a.id===id));
  if (res.length) searchCache.set(ck, res);
  return res;
}
function ytId(s){
  const m = s.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|music\.youtube\.com\/watch\?v=)([\w-]{11})/);
  return m ? m[1] : null;
}

/* ---------- speler ---------- */
let player = null, ready = false, pendingId = null, errStreak = 0;
let positions = store.get('pos', {});        // id -> seconden (alleen lange sets)
let artistPlays = store.get('artists', {});  // artiest -> aantal keer gestart
let sleepAt = 0, sleepEndOfTrack = false;
let autoplay = store.get('autoplay', true);
const infoCache = new Map();
function getInfo(id){
  if (!infoCache.has(id)) infoCache.set(id, fetch('api/video?id=' + id).then(r => r.json()).then(d => d.error ? { tracks:[], related:[] } : d).catch(() => { infoCache.delete(id); return { tracks:[], related:[] }; }));
  return infoCache.get(id);
}
let curInfo = null, curTrackIdx = -1;
// vergelijkbare video's achteraan de wachtrij zetten als die bijna op is
async function extendQueue(force = false){
  const t = cur(); if (!t || (!autoplay && !force) || repeat !== 'off') return 0;
  if (!force && pos() < order.length - 2) return 0;
  const info = await getInfo(t.id);
  const have = new Set(queue.map(x => x.id));
  const cand = info.related.filter(r => !have.has(r.id) && (t.set ? r.seconds >= 1200 : r.seconds >= 60 && r.seconds <= 1200));
  const add = (cand.length ? cand : info.related.filter(r => !have.has(r.id))).slice(0, 8).map(r => ({ ...clean(r), auto:1 }));
  add.forEach(a => { queue.push(a); order.push(queue.length - 1); });
  if (add.length) renderQueue();
  return add.length;
}
async function loadInfoFor(t){
  curInfo = null; curTrackIdx = -1; renderTracklist();
  const info = await getInfo(t.id);
  if (cur() !== t) return;
  curInfo = info; renderTracklist(); extendQueue();
}
function renderTracklist(){
  const el = $('#npTracks'); if (!el) return;
  const tr = curInfo && curInfo.tracks || [];
  if (tr.length < 2){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="qh"><span>Tracklist · ${tr.length}</span></div><div class="tl">${tr.map((x, i) =>
    `<button class="tl-i" data-i="${i}" onclick="seekTrack(${i})"><span class="tl-t">${fmt(x.at)}</span><span class="tl-n">${esc(x.title)}</span></button>`).join('')}</div>`;
  curTrackIdx = -1;
}
function seekTrack(i){ const x = curInfo && curInfo.tracks[i]; if (x && ready){ player.seekTo(x.at, true); player.playVideo(); } }
function updateCurrentTrack(c){
  const tr = curInfo && curInfo.tracks || []; if (tr.length < 2) return;
  let i = -1; for (let k = 0; k < tr.length; k++) if (tr[k].at <= c + 0.5) i = k;
  if (i === curTrackIdx) return;
  curTrackIdx = i;
  document.querySelectorAll('.tl-i').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  const on = document.querySelector('.tl-i.on'); if (on && !$('#np').matches(':hover')) on.scrollIntoView({ block:'nearest' });
  const t = cur(); if (!t || i < 0) return;
  $('#barArtist').textContent = '♪ ' + tr[i].title;
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: tr[i].title, artist: t.title, album:'Claude Music',
    artwork:[{ src:thumb(t.id,'hqdefault'), sizes:'480x360', type:'image/jpeg' }] });
}
function toggleAutoplay(){ autoplay = !autoplay; store.set('autoplay', autoplay); renderQueue(); toast(autoplay ? 'Automatisch doorspelen aan' : 'Automatisch doorspelen uit'); if (autoplay) extendQueue(); }
let queue = [], qi = -1, shuffle = store.get('shuffle', false), repeat = store.get('repeat', 'off');
let playing = false, muted = false, volume = store.get('volume', 80);
let order = []; // speelvolgorde bij shuffle (indices in queue)
let context = null; // waar de wachtrij vandaan komt (route)

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('ytp', {
    width:'100%', height:'100%',
    playerVars:{ playsinline:1, rel:0, modestbranding:1, origin: location.origin },
    events:{
      onReady(){ ready = true; player.setVolume(volume); if (pendingId) { player.loadVideoById(pendingId); pendingId = null; } },
      onStateChange(e){
        if (e.data === YT.PlayerState.PLAYING){ playing = true; errStreak = 0; }
        else if (e.data === YT.PlayerState.PAUSED){ playing = false; }
        else if (e.data === YT.PlayerState.ENDED){ playing = false; onEnded(); }
        updatePlayUI();
      },
      onError(e){
        const t = cur();
        if (++errStreak >= Math.min(queue.length, 8)){ errStreak = 0; playing = false; updatePlayUI(); toast('Deze nummers kunnen niet afgespeeld worden'); return; }
        toast(`“${t ? t.title : 'Nummer'}” mag niet buiten YouTube spelen — overgeslagen`);
        setTimeout(() => next(true), 600);
      },
    },
  });
};
(function loadYT(){ const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

const cur = () => queue[qi] || null;

function playList(tracks, start = 0, ctx = null){
  if (!tracks.length) return;
  queue = tracks.map(clean); context = ctx;
  rebuildOrder(start);
  qi = start;
  loadCurrent();
}
function rebuildOrder(first){
  order = queue.map((_, i) => i);
  if (shuffle){
    order = order.filter(i => i !== first);
    for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [order[i], order[j]] = [order[j], order[i]]; }
    order.unshift(first);
  }
}
function loadCurrent(){
  const t = cur(); if (!t) return;
  const saved = t.set ? positions[t.id] : 0;
  const start = saved && saved > 30 && saved < (t.seconds || 1e9) - 60 ? Math.floor(saved) : 0;
  const arg = start ? { videoId:t.id, startSeconds:start } : t.id;
  if (ready) player.loadVideoById(arg); else pendingId = arg;
  if (start) toast('Verder vanaf ' + fmt(start));
  playing = true;
  if (t.artist){ artistPlays[t.artist] = (artistPlays[t.artist] || 0) + 1; store.set('artists', artistPlays); }
  recent = [t, ...recent.filter(x => x.id !== t.id)].slice(0, 40); store.set('recent', recent);
  document.title = `${t.title} · ${t.artist}`;
  $('#app').classList.remove('no-np');
  if (innerWidth <= 1100 && innerWidth > 720) {} // tablet: paneel blijft dicht tot je erop tikt
  setMedia(t);
  updateNowUI(); updatePlayUI();
  loadInfoFor(t);
}
function pos(){ return order.indexOf(qi); }
function next(manual = false){
  if (!queue.length) return;
  if (repeat === 'one' && !manual){ player.seekTo(0); player.playVideo(); return; }
  let p = pos() + 1;
  if (p >= order.length){
    if (repeat === 'all' || manual){ if (shuffle) rebuildOrder(order[0]); p = 0; }
    else {
      // einde van de wachtrij: aanvullen met vergelijkbare nummers/sets
      if (autoplay) extendQueue(true).then(n => { if (n) next(); else { playing = false; updatePlayUI(); } });
      else { playing = false; updatePlayUI(); }
      return;
    }
  }
  qi = order[p]; loadCurrent();
}
function prev(){
  if (!queue.length) return;
  if (ready && player.getCurrentTime && player.getCurrentTime() > 3){ player.seekTo(0, true); return; }
  const p = Math.max(0, pos() - 1); qi = order[p]; loadCurrent();
}
function onEnded(){
  const t = cur(); if (t && positions[t.id]){ delete positions[t.id]; store.set('pos', positions); }
  if (sleepEndOfTrack){ sleepEndOfTrack = false; playing = false; updatePlayUI(); toast('Slaaptimer: gestopt'); return; }
  next(false);
}
function togglePlay(){
  if (!cur()){ const src = likes.length ? likes : recent; if (src.length) playList(src, 0); else location.hash = '#/zoeken'; return; }
  if (!ready) return;
  if (playing) player.pauseVideo(); else player.playVideo();
}
function toggleShuffle(){
  shuffle = !shuffle; store.set('shuffle', shuffle);
  if (queue.length) rebuildOrder(qi);
  updatePlayUI(); renderQueue(); toast(shuffle ? 'Shuffle aan' : 'Shuffle uit');
}
function cycleRepeat(){
  repeat = { off:'all', all:'one', one:'off' }[repeat]; store.set('repeat', repeat);
  updatePlayUI(); toast({ off:'Herhalen uit', all:'Alles herhalen', one:'Dit nummer herhalen' }[repeat]);
}
function toggleMute(){
  if (!ready) return;
  muted = !muted; muted ? player.mute() : player.unMute(); updatePlayUI();
}
function addToQueue(t, nextUp = false){
  t = clean(t);
  if (!queue.length){ playList([t], 0); return; }
  const at = nextUp ? qi + 1 : queue.length;
  queue.splice(at, 0, t);
  order = order.map(i => i >= at ? i + 1 : i);
  const p = pos();
  order.splice(nextUp ? p + 1 : order.length, 0, at);
  renderQueue(); toast(nextUp ? 'Speelt hierna' : 'Toegevoegd aan wachtrij');
}
function removeUpcoming(p){
  const idx = order[p]; if (idx === qi) return;
  queue.splice(idx, 1);
  order.splice(p, 1);
  order = order.map(i => i > idx ? i - 1 : i);
  if (qi > idx) qi--;
  renderQueue();
}
function clearUpcoming(){
  const t = cur(); if (!t) return;
  queue = [t]; qi = 0; order = [0]; renderQueue();
}
function jumpTo(p){ qi = order[p]; loadCurrent(); }

/* media session: bediening vanaf vergrendelscherm / koptelefoon */
function setMedia(t){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist, album:'Claude Music',
    artwork:[{ src:thumb(t.id,'hqdefault'), sizes:'480x360', type:'image/jpeg' }] });
}
if ('mediaSession' in navigator){
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => player && player.playVideo());
  ms.setActionHandler('pause', () => player && player.pauseVideo());
  ms.setActionHandler('nexttrack', () => next(true));
  ms.setActionHandler('previoustrack', prev);
}

/* voortgang */
let seeking = false;
const seekEl = $('#seek'), volEl = $('#vol');
seekEl.addEventListener('input', () => { seeking = true; const d = ready ? player.getDuration() : 0; $('#tCur').textContent = fmt(d * seekEl.value / 1000); seekEl.style.setProperty('--p', seekEl.value/10 + '%'); });
seekEl.addEventListener('change', () => { if (ready) player.seekTo(player.getDuration() * seekEl.value / 1000, true); seeking = false; });
volEl.value = volume; volEl.style.setProperty('--p', volume + '%');
volEl.addEventListener('input', () => { volume = +volEl.value; volEl.style.setProperty('--p', volume + '%'); if (ready){ player.setVolume(volume); if (muted && volume){ muted = false; player.unMute(); } } store.set('volume', volume); updatePlayUI(); });
setInterval(() => {
  if (!ready || !player.getDuration) return;
  const d = player.getDuration() || 0, c = player.getCurrentTime() || 0;
  $('#tDur').textContent = fmt(d);
  $('#mprog').style.width = d ? (c/d*100) + '%' : '0';
  if (!seeking){ $('#tCur').textContent = fmt(c); const v = d ? Math.round(c/d*1000) : 0; seekEl.value = v; seekEl.style.setProperty('--p', v/10 + '%'); }
  const t = cur();
  if (t && t.set && playing && c > 30 && Math.floor(c) % 5 === 0){ positions[t.id] = c; store.set('pos', positions); }
  updateCurrentTrack(c);
  if (sleepAt && Date.now() >= sleepAt){ sleepAt = 0; player.pauseVideo(); toast('Slaaptimer: gestopt'); }
  if ('mediaSession' in navigator && d && navigator.mediaSession.setPositionState){
    try{ navigator.mediaSession.setPositionState({ duration:d, position:Math.min(c,d), playbackRate:1 }); }catch{}
  }
}, 500);

function sleepMenu(ev){

/* ---------- vind-ik-leuk & afspeellijsten ---------- */
function toggleLike(t){
  if (!t) return; t = clean(t);
  if (isLiked(t)){ likes = likes.filter(x => x.id !== t.id); toast('Verwijderd uit Leuke nummers'); }
  else { likes = [t, ...likes]; toast('Toegevoegd aan Leuke nummers'); }
  store.set('likes', likes);
  updateNowUI(); renderSide();
  document.querySelectorAll(`.tr[data-id="${t.id}"] .like`).forEach(b => { b.classList.toggle('on', isLiked(t)); b.innerHTML = isLiked(t) ? I.heartOn : I.heart; });
  if (route().name === 'liked') render();
}
function prompt2(title, value = '', okText = 'Opslaan'){
  return new Promise(res => {
    const s = document.createElement('div'); s.className = 'scrim';
    s.innerHTML = `<form class="dialog"><h3>${esc(title)}</h3><input maxlength="80" value="${esc(value)}" placeholder="Naam"><div class="row"><button type="button" class="btn ghost">Annuleren</button><button class="btn">${esc(okText)}</button></div></form>`;
    document.body.appendChild(s);
    const inp = s.querySelector('input'); inp.focus(); inp.select();
    const done = v => { s.remove(); res(v); };
    s.querySelector('.ghost').onclick = () => done(null);
    s.onclick = e => { if (e.target === s) done(null); };
    s.querySelector('form').onsubmit = e => { e.preventDefault(); done(inp.value.trim() || null); };
  });
}
async function newPlaylist(withTrack){

function addToPlaylist(plId, t){

  pl.tracks.push({ ...clean(t), auto: undefined }); pl.used = Date.now(); store.set('playlists', playlists); renderSide(); refreshSaved(); toast('Toegevoegd aan ' + pl.name);
  if (route().id === plId) render();
}
function removeFromPlaylist(plId, idx){

/* ---------- toevoegen aan afspeellijst (kiezer) ---------- */
const isSaved = t => t && (isLiked(t) || playlists.some(p => p.tracks.some(x => x.id === t.id)));
function refreshSaved(){
  document.querySelectorAll('[data-add]').forEach(b => {
    const on = !!isSaved({ id: b.dataset.add }); b.classList.toggle('on', on); b.innerHTML = on ? I.added : I.add;
  });
  updateNowUI();
}
function openPicker(tracks){
  tracks = tracks.filter(Boolean).map(clean); if (!tracks.length) return;
  closeMenu();
  const many = tracks.length > 1, t0 = tracks[0];
  const s = document.createElement('div'); s.className = 'sheet-scrim';
  s.innerHTML = `<div class="sheet" role="dialog" aria-label="Toevoegen aan afspeellijst">
    <div class="sh-top"><img src="${thumb(t0.id,'mqdefault')}" alt=""><div style="min-width:0"><div class="t">${many ? tracks.length + ' nummers' : esc(t0.title)}</div><div class="a">${many ? 'Toevoegen aan afspeellijst' : esc(t0.artist)}</div></div></div>
    <label class="sh-search">${I.search}<input placeholder="Zoek of maak een afspeellijst" autocomplete="off" enterkeyhint="done"></label>
    <div class="sh-list"></div>
    <div class="sh-foot"><button class="btn">Klaar</button></div></div>`;
  document.body.appendChild(s);
  const inp = s.querySelector('input'), list = s.querySelector('.sh-list');
  const has = l => tracks.every(t => l.some(x => x.id === t.id));
  const draw = () => {
    const q = inp.value.trim(), ql = q.toLowerCase();
    const pls = [...playlists].sort((a, b) => (b.used || b.created || 0) - (a.used || a.created || 0)).filter(p => !ql || p.name.toLowerCase().includes(ql));
    const exact = playlists.some(p => p.name.toLowerCase() === ql);
    list.innerHTML =
      `<button class="sh-row sh-new" data-new="1"><div class="cov">+</div><div class="nm">${q && !exact ? `Nieuwe afspeellijst “${esc(q)}”` : 'Nieuwe afspeellijst'}</div></button>` +
      (!ql || 'leuke nummers'.includes(ql) ? `<button class="sh-row ${has(likes)?'on':''}" data-like="1">${likedCover}<div class="nm">Leuke nummers<small>${likes.length} nummers</small></div><span class="ck">${I.check}</span></button>` : '') +
      pls.map(p => `<button class="sh-row ${has(p.tracks)?'on':''}" data-pl="${p.id}">${plCover(p)}<div class="nm">${esc(p.name)}<small>${p.tracks.length} nummers</small></div><span class="ck">${I.check}</span></button>`).join('');
  };
  const done = () => { s.remove(); refreshSaved(); renderSide(); const r = route(); if (r.name === 'lijst' || r.name === 'liked') render(); };
  list.addEventListener('click', e => {
    const b = e.target.closest('.sh-row'); if (!b) return;
    if (b.dataset.new){
      const name = inp.value.trim() && !playlists.some(p => p.name.toLowerCase() === inp.value.trim().toLowerCase()) ? inp.value.trim() : null;
      if (!name){ inp.value = ''; inp.placeholder = 'Typ de naam van je nieuwe afspeellijst'; inp.focus(); return; }
      const pl = { id: uid(), name, tracks: tracks.map(t => ({ ...t, auto: undefined })), created: Date.now(), used: Date.now() };
      playlists.push(pl); store.set('playlists', playlists); inp.value = ''; draw(); renderSide();
      toast(`Afspeellijst “${name}” gemaakt`); return;
    }
    if (b.dataset.like){
      if (has(likes)) likes = likes.filter(x => !tracks.some(t => t.id === x.id));
      else likes = [...tracks.filter(t => !likes.some(x => x.id === t.id)), ...likes];
      store.set('likes', likes); draw(); return;
    }
    const pl = playlists.find(p => p.id === b.dataset.pl); if (!pl) return;
    if (has(pl.tracks)){ pl.tracks = pl.tracks.filter(x => !tracks.some(t => t.id === x.id)); toast('Verwijderd uit ' + pl.name); }
    else { tracks.forEach(t => { if (!pl.tracks.some(x => x.id === t.id)) pl.tracks.push({ ...t, auto: undefined }); }); pl.used = Date.now(); toast('Toegevoegd aan ' + pl.name); }
    store.set('playlists', playlists); draw();
  });
  inp.addEventListener('input', draw);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); const first = list.querySelector(inp.value.trim() ? '.sh-row:not(.sh-new)' : '.sh-new'); const nw = list.querySelector('.sh-new');
      (inp.value.trim() && !first ? nw : (first || nw)).click(); }
    if (e.key === 'Escape') done();
  });
  s.addEventListener('click', e => { if (e.target === s) done(); });
  s.querySelector('.sh-foot .btn').onclick = done;
  draw();
  if (innerWidth > 720) inp.focus();
}
// slepen: nummer op een afspeellijst in de zijbalk laten vallen
function dragTrack(ev, key, i){
  const t = lists[key] && lists[key].tracks[i]; if (!t) return;
  ev.dataTransfer.setData('application/x-cm-track', JSON.stringify(clean(t)));
  ev.dataTransfer.setData('text/plain', 'https://www.youtube.com/watch?v=' + t.id);
  ev.dataTransfer.effectAllowed = 'copy';
}
document.addEventListener('dragover', e => {
  const it = e.target.closest && e.target.closest('.pl-item[data-drop]');
  document.querySelectorAll('.pl-item.drop').forEach(x => x !== it && x.classList.remove('drop'));
  if (it && e.dataTransfer.types.includes('application/x-cm-track')){ e.preventDefault(); it.classList.add('drop'); }
});
document.addEventListener('drop', e => {
  const it = e.target.closest && e.target.closest('.pl-item[data-drop]');
  document.querySelectorAll('.pl-item.drop').forEach(x => x.classList.remove('drop'));
  if (!it) return;
  const raw = e.dataTransfer.getData('application/x-cm-track'); if (!raw) return;
  e.preventDefault();
  const t = JSON.parse(raw);
  if (it.dataset.drop === 'liked'){ if (!isLiked(t)) toggleLike(t); else toast('Staat al in Leuke nummers'); }
  else addToPlaylist(it.dataset.drop, t);
  refreshSaved();
});
function saveAsPlaylist(tracks, name){
  tracks = tracks.filter(Boolean).map(t => ({ ...clean(t), auto: undefined })); if (!tracks.length) return;
  prompt2('Opslaan als afspeellijst', name || 'Mijn afspeellijst #' + (playlists.length + 1), 'Opslaan').then(n => {
    if (!n) return;
    const pl = { id: uid(), name: n, tracks: [...new Map(tracks.map(t => [t.id, t])).values()], created: Date.now(), used: Date.now() };
    playlists.push(pl); store.set('playlists', playlists); renderSide(); refreshSaved();
    toast(`“${n}” opgeslagen`);
  });
}

function menuFrom(ev, key, i){ const l = lists[key]; trackMenu(ev, l.tracks[i], l.plId, i); }
function playCtx(ctx, tracks){
  if (context === ctx && cur()){ togglePlay(); return; }

/* ---------- routes / pagina's ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [name, ...rest] = h.split('/');
  if (!name) return { name:'home' };
  if (name === 'zoeken') return { name:'zoeken', q: decodeURIComponent(rest.join('/') || '') };
  if (name === 'lijst') return { name:'lijst', id: rest[0] };
  if (name === 'leuk') return { name:'liked' };
  if (name === 'bibliotheek') return { name:'bibliotheek' };
  if (name === 'genre') return { name:'genre', g: decodeURIComponent(rest.join('/')) };
  if (name === 'sets') return { name:'sets' };
  if (name === 'set') return { name:'set', s: decodeURIComponent(rest.join('/')) };
  if (name === 'koppel') return { name:'koppel', code: rest[0] };
  return { name:'home' };
}

function topArtists(n = 3){
  const score = { ...artistPlays };
  likes.forEach(t => { if (t.artist) score[t.artist] = (score[t.artist] || 0) + 3; });
  return Object.entries(score).filter(([a, c]) => c >= 2 && !/^(q-dance|various|the harder army)$/i.test(a)).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);
}

let addSeq = 0, addQuery = '';
function renderAddPanel(plId){
  const el = $('#addPanel'); const pl = playlists.find(p => p.id === plId); if (!el || !pl) return;
  el.innerHTML = `<h2>${pl.tracks.length ? 'Nummers toevoegen' : 'Laten we iets zoeken voor je afspeellijst'}</h2>

    <div id="addRes" class="add-res"></div>`;
  const inp = $('#addq'); inp.value = addQuery;
  let tmr;
  inp.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => { addQuery = inp.value; fillAdd(plId); }, 350); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ clearTimeout(tmr); addQuery = inp.value; fillAdd(plId); } });
  if (!pl.tracks.length && innerWidth > 720) inp.focus();
  fillAdd(plId);
}
async function fillAdd(plId){
  const el = $('#addRes'); const pl = playlists.find(p => p.id === plId); if (!el || !pl) return;
  const seq = ++addSeq, q = addQuery.trim();
  el.innerHTML = '<div class="spinner"></div>';
  let res = [], title = '';
  try{
    if (q){ res = await search(q); title = ''; }
    else {
      // aanbevolen: vergelijkbaar met de laatste nummers in de lijst (of wat je onlangs luisterde)
      const seeds = (pl.tracks.length ? pl.tracks.slice(-3) : recent.slice(0, 3));
      const infos = await Promise.all(seeds.map(t => getInfo(t.id)));
      const seen = new Set(pl.tracks.map(t => t.id)); const mix = [];
      for (let i = 0; i < 20; i++) for (const inf of infos){ const r = inf.related[i]; if (r && !seen.has(r.id)){ seen.add(r.id); mix.push(clean(r)); } }
      if (!pl.tracks.length) recent.forEach(t => { if (!seen.has(t.id)){ seen.add(t.id); mix.unshift(t); } });
      res = mix.slice(0, 20); title = seeds.length ? 'Aanbevolen' : '';
    }
  }catch(e){ if (seq === addSeq) el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (seq !== addSeq) return;
  lists.addr = { tracks: res, ctx: 'add' };
  const inPl = t => pl.tracks.some(x => x.id === t.id);
  el.innerHTML = (title ? `<div style="color:var(--muted);font-weight:700;margin:12px 0 6px">${title}</div>` : '') + (res.length ? `<div class="tracks">${res.map((t, i) => `
    <div class="tr" data-id="${t.id}" onclick="playFrom('addr',${i})">
      <div class="info"><img src="${thumb(t.id,'mqdefault')}" alt="" loading="lazy"><div style="min-width:0"><div class="tt">${esc(t.title)}</div><div class="ta">${esc(t.artist)}${t.set ? ' · ' + esc(t.duration) : ''}</div></div></div>
      <button class="addbtn ${inPl(t)?'on':''}" onclick="event.stopPropagation();toggleInPlaylist('${plId}',${i},this)">${inPl(t) ? 'Toegevoegd' : 'Toevoegen'}</button>
    </div>`).join('')}</div>` : (q ? `<div class="empty">Niets gevonden voor “${esc(q)}”</div>` : `<div class="empty">Typ hierboven wat je zoekt.</div>`));
  markPlaying();
}
function toggleInPlaylist(plId, i, btn){
  const pl = playlists.find(p => p.id === plId); const t = lists.addr.tracks[i]; if (!pl || !t) return;
  const idx = pl.tracks.findIndex(x => x.id === t.id);
  if (idx >= 0) pl.tracks.splice(idx, 1); else { pl.tracks.push({ ...clean(t), auto: undefined }); pl.used = Date.now(); }
  store.set('playlists', playlists); renderSide();
  btn.classList.toggle('on', idx < 0); btn.textContent = idx < 0 ? 'Toegevoegd' : 'Toevoegen';
  // lijst bovenaan bijwerken zonder het zoekveld kwijt te raken
  const main = $('#main'), y = main.scrollTop, q = $('#addq').value;
  const c = { kind:'Afspeellijst', name:pl.name, cover:plCover(pl), tracks:pl.tracks, ctx:'pl:'+pl.id, plId:pl.id, hero:'#3d3550', keepAdd:true };
  const keep = $('#addPanel'); keep.remove();
  renderCollection(main, c); $('#addPanel').replaceWith(keep); $('#addq').value = q; main.scrollTop = y;
}
function plMenu(ev, id){
  ev.stopPropagation();
  const r = ev.currentTarget.getBoundingClientRect();
  openMenu(r.left, r.bottom + 4, [
    { text:'Aan wachtrij toevoegen', fn:() => { const pl = playlists.find(p => p.id === id); pl.tracks.forEach(t => addToQueue(t)); } },
    { text:'Naam wijzigen', fn:() => renamePlaylist(id) },
    { text:'Afspeellijst verwijderen', fn:() => deletePlaylist(id) },
  ]);
}
function renderLibrary(main){
  main.innerHTML = `<div class="main-inner">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:4px 0 16px">Jouw bibliotheek</h2>
    <button class="btn ghost" onclick="newPlaylist()">+ Afspeellijst</button></div>
    <div class="cards">
      <a class="card" href="#/leuk"><div class="img">${likedCover}</div><div class="t">Leuke nummers</div><div class="s">${likes.length} nummers</div></a>
      ${playlists.map(p => `<a class="card" href="#/lijst/${p.id}"><div class="img">${plCover(p)}</div><div class="t">${esc(p.name)}</div><div class="s">${p.tracks.length} nummers</div></a>`).join('')}
    </div>
    <div class="sync-box">
      <h3>Synchroniseren tussen apparaten</h3>
      ${syncCode ? `<div style="color:var(--muted);font-size:14px">Je leuke nummers, afspeellijsten, eigen live sets en waar je in sets was blijven gelijk op elk gekoppeld apparaat.</div>
        <div class="sync-code">${esc(syncCode)}</div> <span id="syncState" style="color:var(--dim);font-size:13px">${esc(syncState)}</span>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px"><button class="btn" onclick="copySyncLink()">Link kopiëren</button><button class="btn ghost" onclick="pull()">Nu synchroniseren</button><button class="btn ghost" onclick="disableSync()">Ontkoppelen</button></div>
        <p style="color:var(--dim);font-size:13px;margin:10px 0 0">Open de link (of vul de code in) op je telefoon of computer. Iedereen met deze code kan je bibliotheek zien, dus deel hem niet.</p>`
      : `<div style="color:var(--muted);font-size:14px;margin-bottom:12px">Zet het aan op dit apparaat en koppel daarna je andere apparaten met de code.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="enableSync()">Synchronisatie aanzetten</button><button class="btn ghost" onclick="joinSync()">Ik heb al een code</button></div>`}
    </div>
    <div style="margin-top:30px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" onclick="exportData()">Exporteren (back-up)</button>
      <label class="btn ghost" style="cursor:pointer">Importeren<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label>
    </div>
    <p style="color:var(--dim);font-size:13px;margin-top:10px">Zonder synchronisatie staat je bibliotheek alleen in deze browser. Een back-upbestand kun je altijd maken.</p>
  </div>`;
}
function renderSide(){
  const r = route();
  $('#sidePl').innerHTML = `<a class="pl-item ${r.name==='liked'?'active':''}" data-drop="liked" href="#/leuk">${likedCover}<div style="min-width:0"><div class="t">Leuke nummers</div><div class="s">${likes.length} nummers</div></div></a>` +
    playlists.map(p => `<a class="pl-item ${r.id===p.id?'active':''}" data-drop="${p.id}" href="#/lijst/${p.id}">${plCover(p)}<div style="min-width:0"><div class="t">${esc(p.name)}</div><div class="s">Afspeellijst · ${p.tracks.length}</div></div></a>`).join('');
}

/* ---------- synchroniseren tussen apparaten ---------- */
function markDirty(k){
  if (k !== 'pos'){ syncUpdated = Date.now(); store.raw('syncUpdated', syncUpdated); }
  syncDirty = true;
  if (syncCode && k !== 'pos'){ clearTimeout(syncTimer); syncTimer = setTimeout(push, 2000); }
}
const snapshot = () => ({ app:'claude-music', v:2, updated: syncUpdated, likes, playlists, customSets, artists: artistPlays, pos: positions });
function applyLib(d){
  likes = d.likes || []; playlists = d.playlists || []; customSets = d.customSets || []; artistPlays = d.artists || {}; positions = d.pos || {};
  syncUpdated = d.updated || Date.now();
  store.raw('likes', likes); store.raw('playlists', playlists); store.raw('customSets', customSets); store.raw('artists', artistPlays); store.raw('pos', positions); store.raw('syncUpdated', syncUpdated);
  render(); updateNowUI();
}
async function push(keepalive = false){
  if (!syncCode) return;
  syncDirty = false;
  try{
    const r = await fetch('api/sync/' + syncCode, { method:'PUT', body: JSON.stringify(snapshot()), keepalive, headers:{ 'Content-Type':'application/json' } });
    setSyncState(r.ok ? 'Gesynchroniseerd' : 'Synchroniseren mislukt');
  }catch{ syncDirty = true; setSyncState('Offline — probeert later opnieuw'); }
}
async function pull(){
  if (!syncCode) return;
  lastPull = Date.now();
  try{
    const d = await (await fetch('api/sync/' + syncCode, { cache:'no-store' })).json();
    if (d.empty) return push();
    if ((d.updated || 0) > syncUpdated) applyLib(d);
    else if (syncUpdated > (d.updated || 0) || syncDirty) await push();
    setSyncState('Gesynchroniseerd');
  }catch{ setSyncState('Offline'); }
}
function setSyncState(t){ syncState = t; const el = $('#syncState'); if (el) el.textContent = t; }
// samenvoegen bij het koppelen van een apparaat, zodat er niets verloren gaat
function mergeLib(a, b){
  const byId = (x, y, k = 'id') => { const m = new Map(); [...x, ...y].forEach(i => { if (!m.has(i[k])) m.set(i[k], i); }); return [...m.values()]; };
  const pls = new Map();
  [...(a.playlists || []), ...(b.playlists || [])].forEach(p => { const e = pls.get(p.id); pls.set(p.id, e ? { ...e, tracks: byId(e.tracks, p.tracks) } : p); });
  const artists = { ...(a.artists || {}) }; Object.entries(b.artists || {}).forEach(([k, v]) => artists[k] = Math.max(artists[k] || 0, v));
  const pos = { ...(b.pos || {}), ...(a.pos || {}) };
  return { likes: byId(a.likes || [], b.likes || []), playlists: [...pls.values()], customSets: byId(a.customSets || [], b.customSets || [], 'name'), artists, pos, updated: Date.now() };
}
async function enableSync(code){
  const fresh = !code;
  code = (code || (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'').slice(0, 12) : uid() + uid())).toLowerCase().replace(/[^a-z0-9]/g, '');
  if (code.length < 10){ toast('Die code klopt niet'); return; }
  let remote = { empty:true };
  if (!fresh){ try{ remote = await (await fetch('api/sync/' + code, { cache:'no-store' })).json(); }catch{ toast('Geen verbinding'); return; } }
  syncCode = code; store.raw('syncCode', code);
  applyLib(remote.empty ? { ...snapshot(), updated: Date.now() } : mergeLib(remote, snapshot()));
  await push();
  toast(fresh ? 'Synchronisatie staat aan' : 'Apparaat gekoppeld');
  if (route().name !== 'bibliotheek') location.hash = '#/bibliotheek'; else render();
}
async function joinSync(){
  const c = await prompt2('Code van je andere apparaat', '', 'Koppelen');
  if (c) enableSync(c);
}
function disableSync(){
  if (!confirm('Dit apparaat ontkoppelen? Je bibliotheek blijft hier gewoon staan.')) return;
  syncCode = null; localStorage.removeItem('dt.syncCode'); render();
}
function copySyncLink(){
  const link = location.origin + location.pathname + '#/koppel/' + syncCode;
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Link gekopieerd — open hem op je andere apparaat'), () => prompt('Kopieer deze link:', link));
}
document.addEventListener('visibilitychange', () => {
  if (!syncCode) return;
  if (document.visibilityState === 'hidden'){ if (syncDirty) push(true); }
  else if (Date.now() - lastPull > 30000) pull();
});

/* back-up */
function exportData(){
  const blob = new Blob([JSON.stringify({ app:'claude-music', v:1, likes, playlists }, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'claude-music-backup.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importData(file){
  if (!file) return;
  try{
    const d = JSON.parse(await file.text());
    if (!['draaitafel','claude-music'].includes(d.app)) throw 0;
    const ids = new Set(likes.map(t => t.id));
    likes = [...likes, ...(d.likes || []).filter(t => !ids.has(t.id))];
    const pids = new Set(playlists.map(p => p.id));
    playlists = [...playlists, ...(d.playlists || []).filter(p => !pids.has(p.id))];
    saveAll(); render(); toast('Bibliotheek geïmporteerd');
  }catch{ toast('Dit is geen geldige back-up'); }
}

/* sneltoetsen */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) next(true);
  else if (e.key === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.key === '/'){ e.preventDefault(); location.hash = '#/zoeken'; }
});

addEventListener('hashchange', render);
render(); updateNowUI(); updatePlayUI();
if (syncCode) pull();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
